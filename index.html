<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ziangdotz</title>
<meta name="description" content="ziangdotz 的个人主页与项目记录" />
<meta name="theme-color" content="#0d1117" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-dim: #59636e;
      --accent: #0969da;
      --accent-soft: rgba(9, 105, 218, 0.1);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
      "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 640px;
    padding: 40px 32px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    text-align: center;
    animation: rise 0.6s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  .avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 30px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--border);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: -0.02em;
  }

  .tagline {
    margin: 0 0 24px;
    color: var(--text-dim);
    font-size: 15px;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    outline: none;
  }

  .note {
    margin: 0;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
  }

  code {
    padding: 2px 6px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    background: var(--accent-soft);
    border-radius: 4px;
    color: var(--accent);
  }

  footer {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">Z</div>

    <h1>ziangdotz</h1>
    <p class="tagline">Hello, world. 这里是我的 GitHub Pages 站点。</p>

    <nav class="links">
      <a href="https://github.com/ziangdotz" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://github.com/ziangdotz?tab=repositories" target="_blank" rel="noopener noreferrer">项目仓库</a>
      <a href="https://github.com/ziangdotz/ziangdotz.github.io" target="_blank" rel="noopener noreferrer">站点源码</a>
    </nav>

    <p class="note">
      页面正在建设中，稍后会加入项目作品与技术文章。<br />
      内容由 <code>main</code> 分支自动发布。
    </p>

    <footer>© <span id="year">2026</span> ziangdotz · Powered by GitHub Pages</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
